<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t10 d10">
  <title id="t10">Multi-Instance Virtual Display and NVENC Streaming Topology</title>
  <desc id="d10">Systems architecture showing RTX GPU NVENC P1 encoder routing across Virtual Display Driver GUIDs to dual iPad Pro 120Hz and 5K iMac screens.</desc>
  <style>
    .bg { fill: #0B111A; }
    .panel { fill: #131B26; stroke: #233142; stroke-width: 1.2; }
    .block-card { fill: #1A2536; stroke: #2A3B50; stroke-width: 1.2; }
    .txt-main { fill: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .txt-sub { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .txt-mono { fill: #38BDF8; font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .stream-wire { stroke: #38BDF8; stroke-width: 2; stroke-dasharray: 6 6; animation: flowStream 10s linear infinite; }
    
    @keyframes flowStream { to { stroke-dashoffset: -120; } }

    @media (prefers-color-scheme: light) {
      .bg { fill: #F8FAFC; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; }
      .block-card { fill: #F1F5F9; stroke: #CBD5E1; }
      .txt-main { fill: #0F172A; }
      .txt-sub { fill: #475569; }
      .txt-mono { fill: #0284C7; }
      .stream-wire { stroke: #0284C7; }
    }
  </style>

  <rect width="1200" height="420" rx="16" class="bg"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.3"/>

  <!-- Header -->
  <g transform="translate(50, 24)">
    <text x="0" y="24" class="txt-main" font-size="18" font-weight="700">MULTI-INSTANCE VIRTUAL DISPLAY &amp; NVENC STREAMING TOPOLOGY</text>
    <text x="0" y="44" class="txt-sub" font-size="12">Hardware-Accelerated Encoding · VDD Virtual Displays · Multi-Daemon Routing · Apple Silicon Receivers</text>
  </g>

  <!-- Connective Pipeline Wires -->
  <g fill="none">
    <path d="M 320 200 L 400 200" class="stream-wire"/>
    <path d="M 740 160 C 780 160, 780 140, 820 140" class="stream-wire"/>
    <path d="M 740 240 C 780 240, 780 260, 820 260" class="stream-wire"/>
  </g>

  <!-- Left: Host Workstation & GPU -->
  <g transform="translate(50, 95)">
    <rect width="270" height="295" rx="12" class="panel"/>
    <rect x="16" y="16" width="238" height="30" rx="6" fill="#10B981" fill-opacity="0.15"/>
    <text x="26" y="36" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">HOST WORKSTATION</text>

    <g transform="translate(16, 60)">
      <rect width="238" height="66" rx="8" class="block-card"/>
      <text x="14" y="24" class="txt-main" font-size="13" font-weight="600">RTX Hardware Encoder</text>
      <text x="14" y="46" class="txt-mono" font-size="11" fill="#10B981">NVENC P1 Ultra-Low Latency</text>
    </g>

    <g transform="translate(16, 136)">
      <rect width="238" height="66" rx="8" class="block-card"/>
      <text x="14" y="24" class="txt-main" font-size="13" font-weight="600">Virtual Display Driver</text>
      <text x="14" y="46" class="txt-mono" font-size="11" fill="#38BDF8">VDD GUID 1..3 Displays</text>
    </g>

    <g transform="translate(16, 212)">
      <rect width="238" height="66" rx="8" class="block-card"/>
      <text x="14" y="24" class="txt-main" font-size="13" font-weight="600">Network Routing</text>
      <text x="14" y="46" class="txt-mono" font-size="11" fill="#F59E0B">Wired Thunderbolt / 2.5GbE</text>
    </g>
  </g>

  <!-- Center: Dual Sunshine Instances -->
  <g transform="translate(400, 95)">
    <rect width="340" height="295" rx="12" class="panel"/>
    <rect x="16" y="16" width="308" height="30" rx="6" fill="#0284C7" fill-opacity="0.15"/>
    <text x="26" y="36" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">DUAL-INSTANCE STREAMING DAEMONS</text>

    <g transform="translate(16, 60)">
      <rect width="308" height="100" rx="8" class="block-card"/>
      <text x="14" y="24" class="txt-main" font-size="13" font-weight="600">Instance 0: High-Refresh Target</text>
      <text x="14" y="44" class="txt-mono" font-size="11" fill="#38BDF8">Port: 47989 · UniqueID: 0xAPOLLO_0</text>
      <text x="14" y="66" class="txt-sub" font-size="11">Target: Displays 1 &amp; 2 (ProMotion 120Hz)</text>
      <text x="14" y="86" class="txt-mono" font-size="10" fill="#10B981">Throughput: 80 Mbps · Sub-10ms Pacing</text>
    </g>

    <g transform="translate(16, 175)">
      <rect width="308" height="100" rx="8" class="block-card"/>
      <text x="14" y="24" class="txt-main" font-size="13" font-weight="600">Instance 1: High-Resolution Target</text>
      <text x="14" y="44" class="txt-mono" font-size="11" fill="#38BDF8">Port: 48000 · UniqueID: 0xAPOLLO_1</text>
      <text x="14" y="66" class="txt-sub" font-size="11">Target: Display 3 (5K Retina Display)</text>
      <text x="14" y="86" class="txt-mono" font-size="10" fill="#10B981">Throughput: 120 Mbps · 10-Bit Color</text>
    </g>
  </g>

  <!-- Right: Receiver Displays -->
  <g transform="translate(820, 95)">
    <rect width="330" height="295" rx="12" class="panel"/>
    <rect x="16" y="16" width="298" height="30" rx="6" fill="#8B5CF6" fill-opacity="0.15"/>
    <text x="26" y="36" fill="#8B5CF6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">APPLE RECEIVER DISPLAYS</text>

    <!-- Target 1: iPad Pro -->
    <g transform="translate(16, 60)">
      <rect width="298" height="100" rx="8" class="block-card"/>
      <text x="14" y="24" class="txt-main" font-size="13" font-weight="600">iPad Pro 12.9" M2</text>
      <text x="14" y="44" class="txt-mono" font-size="11" fill="#8B5CF6">Resolution: 2732 x 2048 @ 120Hz</text>
      <text x="14" y="66" class="txt-sub" font-size="11">ProMotion Direct Decoding</text>
      <text x="14" y="86" class="txt-mono" font-size="10" fill="#10B981">Frametime: 8.28 ms · Zero Jitter</text>
    </g>

    <!-- Target 2: 5K iMac -->
    <g transform="translate(16, 175)">
      <rect width="298" height="100" rx="8" class="block-card"/>
      <text x="14" y="24" class="txt-main" font-size="13" font-weight="600">iMac 27" 5K Retina</text>
      <text x="14" y="44" class="txt-mono" font-size="11" fill="#8B5CF6">Resolution: 5120 x 2880 @ 60Hz</text>
      <text x="14" y="66" class="txt-sub" font-size="11">Hardware HEVC Video Decoding</text>
      <text x="14" y="86" class="txt-mono" font-size="10" fill="#10B981">Color Accuracy: 100% sRGB / DCI-P3</text>
    </g>
  </g>

  <!-- Flying Stream Packets -->
  <circle r="4.5" fill="#10B981">
    <animateMotion path="M 320 200 L 400 200" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#38BDF8">
    <animateMotion path="M 740 160 C 780 160, 780 140, 820 140" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#8B5CF6">
    <animateMotion path="M 740 240 C 780 240, 780 260, 820 260" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>