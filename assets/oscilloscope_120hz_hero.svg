<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t9 d9">
  <title id="t9">Hardware Logic Analyzer and 120Hz Frametime Oscilloscope</title>
  <desc id="d9">Realtime frametime logic analyzer oscilloscope displaying stable frame delivery beneath the 8.33 ms 120Hz ProMotion threshold.</desc>
  <style>
    .bg { fill: #0B111A; }
    .panel { fill: #131B26; stroke: #233142; stroke-width: 1.2; }
    .sub-card { fill: #1A2536; stroke: #2A3B50; stroke-width: 1; }
    .txt-main { fill: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .txt-sub { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .txt-mono { fill: #38BDF8; font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    
    .scope-grid { stroke: #1E293B; stroke-width: 0.75; }
    .baseline-60 { stroke: #EF4444; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .target-120 { stroke: #10B981; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .trace-line { fill: none; stroke: #38BDF8; stroke-width: 2.2; stroke-linecap: round; }
    .cursor-dot { fill: #38BDF8; animation: moveCursor 3s linear infinite; }

    @keyframes moveCursor { 0% { transform: translateX(0px); } 100% { transform: translateX(710px); } }

    @media (prefers-color-scheme: light) {
      .bg { fill: #F8FAFC; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; }
      .sub-card { fill: #F1F5F9; stroke: #E2E8F0; }
      .txt-main { fill: #0F172A; }
      .txt-sub { fill: #475569; }
      .txt-mono { fill: #0284C7; }
      .scope-grid { stroke: #E2E8F0; }
      .trace-line { stroke: #0284C7; }
    }
  </style>

  <rect width="1200" height="480" rx="16" class="bg"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.3"/>

  <!-- Header -->
  <g transform="translate(50, 24)">
    <text x="0" y="24" class="txt-main" font-size="18" font-weight="700">HARDWARE LOGIC ANALYZER &amp; 120Hz FRAMETIME OSCILLOSCOPE</text>
    <text x="0" y="44" class="txt-sub" font-size="12">Direct NVENC P1 Frame Pacing · Apple ProMotion 120Hz Budget: 8.33 ms · Jitter &lt; 1.2 ms</text>
  </g>

  <!-- Left: Oscilloscope Reticle -->
  <g transform="translate(50, 85)">
    <rect width="780" height="360" rx="12" class="panel"/>

    <!-- Grid Lines (10 cols x 8 rows) -->
    <g class="scope-grid">
      <line x1="40" y1="50" x2="740" y2="50"/>
      <line x1="40" y1="100" x2="740" y2="100"/>
      <line x1="40" y1="150" x2="740" y2="150"/>
      <line x1="40" y1="210" x2="740" y2="210"/>
      <line x1="40" y1="260" x2="740" y2="260"/>
      <line x1="40" y1="310" x2="740" y2="310"/>
      <line x1="110" y1="40" x2="110" y2="320"/>
      <line x1="180" y1="40" x2="180" y2="320"/>
      <line x1="250" y1="40" x2="250" y2="320"/>
      <line x1="320" y1="40" x2="320" y2="320"/>
      <line x1="390" y1="40" x2="390" y2="320"/>
      <line x1="460" y1="40" x2="460" y2="320"/>
      <line x1="530" y1="40" x2="530" y2="320"/>
      <line x1="600" y1="40" x2="600" y2="320"/>
      <line x1="670" y1="40" x2="670" y2="320"/>
    </g>

    <!-- 60Hz Reference Baseline -->
    <line x1="40" y1="100" x2="740" y2="100" class="baseline-60"/>
    <text x="735" y="94" class="txt-mono" font-size="10" text-anchor="end" fill="#EF4444">60Hz Legacy Baseline (16.67 ms)</text>

    <!-- 120Hz Target Budget -->
    <line x1="40" y1="210" x2="740" y2="210" class="target-120"/>
    <text x="735" y="204" class="txt-mono" font-size="10" text-anchor="end" fill="#10B981">120Hz ProMotion Target (8.33 ms)</text>

    <!-- Realtime Oscilloscope Waveform -->
    <polyline points="80,209.5 88,210.1 96,208.2 104,210.3 112,217.1 120,214.7 128,212.8 136,211.6 144,206.3 152,210.0 160,214.7 168,213.9 176,216.2 184,212.3 192,206.7 200,210.1 208,211.1 216,213.4 224,217.9 232,212.6 240,209.3 248,209.9 256,207.8 264,213.2 272,217.2 280,213.3 288,213.0 296,209.4 304,206.3 312,212.6 320,214.5 328,214.5 336,216.0 344,209.3 352,207.3 360,211.1 368,211.1 376,215.7 384,217.0 392,210.4 400,209.8 408,209.0 416,208.7 424,215.9 432,216.0 440,212.7 448,212.6 456,207.3 464,208.1 472,214.3 480,213.9 488,215.6 496,214.3 504,207.2 512,208.9 520,211.3 528,212.0 536,217.5 544,214.7 552,209.3 560,210.2 568,208.0 576,211.0 584,217.3 592,214.3 600,212.9 608,211.1 616,206.1 624,210.7 632,214.7 640,214.0 648,216.2 656,211.5 664,206.7 672,210.4 680,211.0 688,214.0 696,217.8 704,212.0 712,209.4 720,209.7 728,207.9 736,214.0 744,217.0 752,213.1 760,213.0 768,208.8 776,206.6 784,213.2 792,214.3" class="trace-line"/>

    <!-- Animated Flying Scope Cursor -->
    <g class="cursor-dot" transform="translate(80, 212)">
      <circle cx="0" cy="0" r="5" fill="#38BDF8"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
    </g>

    <text x="45" y="340" class="txt-mono" font-size="10">Timebase: 2.0 ms/div · Voltage: 1.0 V/div · Trigger: Ch1 Rising (8.30 ms)</text>
  </g>

  <!-- Right: Pacing Telemetry Panel -->
  <g transform="translate(850, 85)">
    <rect width="300" height="360" rx="12" class="panel"/>
    <text x="20" y="32" class="txt-main" font-size="13" font-weight="700">MEASUREMENT TELEMETRY</text>

    <g transform="translate(20, 52)">
      <rect width="260" height="66" rx="8" class="sub-card"/>
      <text x="14" y="22" class="txt-sub" font-size="11">Mean Frametime</text>
      <text x="14" y="48" class="txt-mono" font-size="20" font-weight="700">8.28 ms</text>
    </g>

    <g transform="translate(20, 130)">
      <rect width="260" height="66" rx="8" class="sub-card"/>
      <text x="14" y="22" class="txt-sub" font-size="11">Frametime Jitter</text>
      <text x="14" y="48" class="txt-mono" font-size="18" font-weight="700" fill="#10B981">&lt; 1.2 ms (0.31 ms σ)</text>
    </g>

    <g transform="translate(20, 208)">
      <rect width="260" height="126" rx="8" class="sub-card"/>
      <text x="14" y="22" class="txt-sub" font-size="11">Pacing Stability</text>
      <text x="14" y="42" class="txt-main" font-size="12" font-weight="600">Dropped Frames: 0 (0.00%)</text>
      <text x="14" y="66" class="txt-sub" font-size="11">Hardware Sync: Locked</text>
      <text x="14" y="86" class="txt-sub" font-size="11">NVENC Preset: P1 Low Latency</text>
      <text x="14" y="108" class="txt-mono" font-size="10" fill="#10B981">120.00 Hz Refresh Maintained</text>
    </g>
  </g>
</svg>